# ============================================================================
# 任务定义（Task Definition）· 多模态极限性能专项
# ----------------------------------------------------------------------------
# 基线：report_qwen3.8-27b-decode-multi-mode-opt.md 的 B9_final
#   （mmproj-Q8 + 主 KV q4_0/q4_0 + draft KV q4_0 + n-max 2 + cap 1024 + p2）
# 目标：在**不牺牲视觉质量**的前提下，把单卡多模态输出速率推到物理极限，
#       并回答三个问题：
#         1. 极限在哪（多少 t/s 是硬件天花板，多少是配置问题）；
#         2. 用什么手段逼近（草稿深度 / 并发策略 / 分辨率 / batch）；
#         3. 逼近之后付出了什么（显存、上下文、质量、体感抖动）。
#
# 与上一轮（multi-mode-opt）的差别：
#   上一轮解决的是「多模态能不能用 + 显存够不够」；
#   本轮解决的是「在够用的基础上，输出速率还能不能更快」。
#   因此 KPI 的重心从「显存 / 质量底线」转向「吞吐 / 单步耗时 / 体感抖动」。
# ============================================================================

task:
  id: qwen3.8-27b-decode-multi-mode-uplimit-opt
  title: Qwen3.8-27B 多模态极限性能分析与优化
  scope: decode
  backend: gpu
  priority: latency
  description: >
    以 B9_final（92.65 t/s 单流、96.13 t/s 视觉 Decode）为基线，在 RTX 4090
    单卡上把多模态 Decode 推到物理极限。核心手段是**加深 MTP 草稿深度**
    （n-max 2→4）与**改并发策略**（parallel 2→1），并给出「每步耗时随草稿
    深度增长」的定量模型，说明为什么 n-max=4 之后继续加深是负收益。

# ---- 测试场景矩阵 ---------------------------------------------------------
scenarios:
  - id: short_chat
    desc: 纯文本短对话（验证草稿深度对纯文本路径的收益）
    prompt_tokens: 72
    gen_tokens: 128
    parallel: 1
    weight: 0.15
  - id: long_ctx
    desc: 纯文本长上下文（28K）
    prompt_tokens: 28372
    gen_tokens: 64
    parallel: 1
    weight: 0.15
  - id: vis_512
    desc: 512px 图片（256 image tokens）视觉问答
    prompt_tokens: 300
    gen_tokens: 128
    parallel: 1
    weight: 0.10
  - id: vis_1024
    desc: 1024px 图片（cap 768 → 729 image tokens）视觉问答
    prompt_tokens: 788
    gen_tokens: 128
    parallel: 1
    weight: 0.20
  - id: vis_2048
    desc: 2048px 图片（cap 768 压回 729 image tokens）
    prompt_tokens: 788
    gen_tokens: 128
    parallel: 1
    weight: 0.15
  - id: vis_long32k
    desc: 图片 + 28K 文本混合长上下文
    prompt_tokens: 29403
    gen_tokens: 64
    parallel: 1
    weight: 0.10
  - id: concurrent_2
    desc: 双路并发（**两路均带图**：1024px + 2048px，cap 768 后各 729 image token）
    prompt_tokens: 1068
    gen_tokens: 128
    parallel: 2
    weight: 0.05
  - id: quality_ocr
    desc: 视觉质量守门（8 项简单题）
    parallel: 1
    weight: 0.04
  - id: quality_hard
    desc: 视觉质量难题（7 项：密集表 / 网格 / 长文本针 / 图+长文本）
    parallel: 1
    weight: 0.04
  - id: kv_stress
    desc: KV 精度压力测试（24K 文本埋 20 条同类码）
    parallel: 1
    weight: 0.02

# ---- KPI 指标定义 ---------------------------------------------------------
kpis:
  - key: decode_tps
    name: Decode 吞吐（纯文本单流）
    unit: tokens/s
    direction: higher
    target: 90
    scenario: short_chat
    target_rationale: >
      **必须区分两种基线**：上一轮报告写的是 92.65 t/s（跨会话），
      而本轮同会话复测同一配置只有 83.66 t/s —— 跨会话的机器状态差异
      约 ±8%，大于配置本身带来的差异。因此本报告一律用**同会话**对照。
      同会话基线 83.66，目标 90（×1.076），实测 91.56（16 次中位）。
    definition: >
      稳态自回归生成速率，取首 token 到末 token 的斜率。
      **注意 MTP 下这个值 = mean_accepted_len × 步进率**，
      必须与 mean_len 一起读，否则会把「一步多 token」误读成「单步更快」。
  - key: decode_tps_32k
    name: Decode 吞吐（28K 上下文）
    unit: tokens/s
    direction: higher
    target: 70
    scenario: long_ctx
    target_rationale: >
      **这一项必须先讲清楚测量问题**：同一配置的 28K Decode 跨会话中位在
      55~84 t/s 之间跳动（合并 n=48，中位 79.27，变异系数 15.8%，见台账
      extra.variance_28k）。因此本报告不采信 4~8 次采样的单个中位值：
      基线 69.97（n=4）与最终配置 64.97（n=8）**都落在同一分布内**，
      不能判定存在配置性退化。
      最终配置取 12 次高重复数对照的 78.12，目标 70（不倒退）。
      **结论表述为「28K 无显著变化」，而不是「+11.7%」或「-7.1%」** ——
      效应量小于方差时，任何方向都不该被报告为结论。
    definition: depth≈28K 时的稳态自回归速率。
  - key: decode_tps_system
    name: 系统总吞吐（双路并发）
    unit: tokens/s
    direction: higher
    target: 60
    scenario: concurrent_2
    target_rationale: >
      **口径必须说清**：本指标按 §1.6 的定义取 concurrent_2 场景，
      而该场景在基线与本轮之间同时变了 cap（1024→768）、n-max（2→4）、
      parallel（2→1）三个变量 —— 53.25 vs 67.29（-20.9%）**不能归因给并发**。
      为此另做了一组受控 A/B（只换 --parallel，见 §5.7.1）：
      p2 42.97 → p1 38.39，**真实并发代价 -10.7%**。
      目标 60 仍按原口径设定，实测 53.25 未达标；受控口径下 p1 为 38.39、
      p2 为 42.97，均低于 60 —— 说明该目标本身偏高，已记入 §6.2。
    definition: 所有并发槽位产出 token 之和 / 墙钟时间。
  - key: vis_decode_tps
    name: 视觉 Decode 吞吐（1024px）
    unit: tokens/s
    direction: higher
    target: 100
    scenario: vis_1024
    target_rationale: >
      本轮主 KPI。B9_final 96.13 t/s；本轮全量套件实测 100.08（10 次中位）。
      **必须说明一个 ±10% 的口径问题**：同一个配置、同一张图，
      只换提问文本，Decode 中位会在 102~121 t/s 之间变化
      （见 §5.7.3 的 prompt 敏感性实验）—— 因为 MTP 接受长度取决于
      生成内容的重复度：要求「读出所有可见文字」时输出高度重复、
      接受长度高；自由描述时接受长度低。
      因此目标取 100（生产口径：完整描述 + OCR 混合），
      并把 121 t/s 记为「重复型输出的上限」单列。
    definition: 带图请求首 token 到末 token 的斜率（全量套件，混合提问）。
  - key: vis_decode_tps_repetitive
    name: 视觉 Decode 吞吐（重复型输出）
    unit: tokens/s
    direction: higher
    target: 120
    scenario: null
    target_rationale: >
      同一配置、同一张图，提问为「描述图片并读出所有可见文字」时
      5 次中位 121.24 t/s（范围 120.3~122.4，离散度仅 1.7%）。
      这是 MTP 在「高重复度输出」上的上限 —— 也是本配置能达到的
      最高稳定输出速率。它说明**输出速率不是配置的常数属性，
      而是配置 × 内容类型的联合属性**。
    definition: 固定图片与固定提问（重复型）下 5 次的中位 Decode 速率。
  - key: vis_decode_tps_2048
    name: 视觉 Decode 吞吐（2048px）
    unit: tokens/s
    direction: higher
    target: 95
    scenario: vis_2048
    target_rationale: >
      同会话基线 95.55，目标 95 即「不倒退」；实测 99.78（10 次中位）。
      2048px 在 cap 768 下与 1024px 等价（都是 729 image token），
      因此该值应接近 vis_1024 —— 实测确实如此（99.78 vs 100.08）。
    definition: 2048px 图请求的稳态 Decode 速率（cap 768 生效后）。
  - key: vis_ttft_ms
    name: 视觉请求首 Token 延迟（1024px）
    unit: ms
    direction: lower
    target: 870
    scenario: vis_1024
    target_rationale: >
      同会话基线 873.3，目标 870 即「不倒退」；实测 858.4（-1.7%）。
      **注意收益远小于组件改进**：ViT 从 467 降到 347 ms（-120 ms）、
      文本侧 prefill 从 1083 token 降到 788（约 -100 ms），
      但端到端 TTFT 只降了 15 ms —— 因为 HTTP/调度/采样等固定开销
      约 300 ms，把改善吃掉了大半。这就是为什么「优化组件」不等于
      「优化体验」。
    definition: 带图请求从发出到首个输出 token 的时间。
  - key: image_tokens_per_image
    name: 每图图像 token 数
    unit: tokens
    direction: lower
    target: 768
    scenario: vis_1024
    target_rationale: >
      cap 768 时实际生效 729 token（边长 864 px，27×27 patch）。
      **这不只是省 token**：实测 cap 1024/1280 时「图 + 20K 文本」的注意力
      会偏到图片上（3/3 失败），而 cap 768 时 3/3 正确 ——
      分辨率上限同时是质量杠杆，见 §5.7.2。
    definition: prompt_tokens − 文本 token 数。
  - key: vision_encode_ms
    name: ViT 编码耗时（1024px 图，cap 768）
    unit: ms
    direction: lower
    target: 400
    scenario: vis_1024
    target_rationale: >
      实测 347~350 ms（-v 日志 image decoded 行），cap 1024 时为 467~473 ms。
      目标 400 取实测上限 +14%。
    definition: clip_encode 拷贝完成到 image decoded 的时间。
  - key: step_ms
    name: 单步耗时（MTP 一次验证）
    unit: ms
    direction: lower
    target: 34
    scenario: short_chat
    target_rationale: >
      **本轮最重要的新增指标**。MTP 下 Decode 速率 = mean_len ÷ 步耗时，
      只看 t/s 无法判断「还差多少」。实测：无投机 20.47 ms/步、
      n-max=3 30.38、n-max=4 32.42、n-max=5 36.31、n-max=6 38.57、n-max=8 47.72。
      步耗时随 n-max 近似线性增长（每多一个草稿 token 约 +3.4 ms），
      而 mean_len 在 n-max=4 后饱和 —— 这就是「n-max=4 是拐点」的定量依据。
    definition: 1 / (decode_tps ÷ mean_accepted_len)，单位 ms。
  - key: mtp_accept_rate
    name: 投机接受率
    unit: ratio
    direction: higher
    target: 0.45
    scenario: null
    target_rationale: >
      n-max=4 时逐请求实测均值 0.50~0.52（n-max=2 为 0.66~0.70）。
      接受率随草稿深度单调下降是必然的（越往后越难猜对），
      真正决定收益的是 mean_len：n-max=2 → 2.3，n-max=4 → 3.0。
    definition: 被主模型接受的 draft token 数 / draft 总提案数。
  - key: itl_ms_p95
    name: 输出间隔 p95（体感抖动）
    unit: ms
    direction: lower
    target: 35
    scenario: short_chat
    target_rationale: >
      「极致体验」不能只看平均速率：用户感知的是卡顿。
      实测 p95 在 30~41 ms（28K 上下文下 40 ms，短对话 31 ms）。
      目标 35 取短对话实测上限 +13%；**该指标不随 n-max 变化**
      —— 说明加深草稿不会让输出变得更「一卡一卡」，这是 n-max=4 可用的前提。
    definition: 相邻 chunk 到达间隔的 95 分位（客户端流式计时）。
  - key: quality_pass_rate
    name: 视觉质量通过率（简单题）
    unit: ratio
    direction: higher
    target: 1.0
    scenario: quality_ocr
    target_rationale: 8 项简单题在全部配置下均 8/8，是硬底线。
    definition: 通过项 / 总项（答案先剥离 markdown 与空白）。
  - key: hard_quality_pass_rate
    name: 视觉质量通过率（难题）
    unit: ratio
    direction: higher
    target: 1.0
    scenario: quality_hard
    target_rationale: >
      上一轮 6/7（「图 + 20K 文本」项失败，当时归因为模型能力边界）。
      本轮发现**根因是 cap 过大**：cap 768 时该项 3/3 通过，
      cap 1024/1280 时 3/3 失败。修正后 7/7。
      因此目标设 1.0 —— 这是一次「以为做不到、其实做得到」的修正。
    definition: 同上。
  - key: kv_retrieval_pass
    name: KV 精度检索通过率
    unit: ratio
    direction: higher
    target: 1.0
    scenario: kv_stress
    target_rationale: 24K 文本埋 20 条同类码，四档 KV 精度均 3/3。
    definition: 命中数 / 3。
  - key: peak_vram_mib
    name: 峰值显存
    unit: MiB
    direction: lower
    target: 20480
    scenario: null
    target_rationale: >
      最终配置（p1 + n-max 4 + b2048）峰值 19,851~19,857 MiB，余量 4.60 GiB。
      对照：p2 + n-max 4 为 20,535 MiB（余量 3.94 GiB，**越线**）。
      这是选择 p1 的第二个理由（第一个是 28K Decode 更快）。
    definition: 进程生命周期内 nvidia-smi 采样的最大值。
  - key: safety_margin_gib
    name: 显存安全冗余
    unit: GiB
    direction: higher
    target: 4.0
    scenario: null
    target_rationale: 硬约束；实测 4.60 GiB。
    definition: (vram_total - peak_vram) / 1024。
  - key: ctx_single_request
    name: 单请求可用上下文
    unit: tokens
    direction: higher
    target: 65536
    scenario: null
    target_rationale: >
      --parallel 1 时每槽 = 总上下文 = 65,536 token（实测可处理 53,178）。
      上一轮 p2 时每槽只有 32,768 —— 这是本轮换成 p1 换来的**能力提升**，
      不只是性能数字。
    definition: --ctx-size / --parallel。
  - key: gpu_util
    name: GPU 利用率
    unit: ratio
    direction: higher
    target: null
    definition: nvidia-smi utilization.gpu 采样中位数（观测项）。
  - key: power_w
    name: GPU 功耗
    unit: W
    direction: lower
    target: null
    definition: 采样峰值（观测项）。
  - key: temp_c
    name: GPU 温度
    unit: C
    direction: lower
    target: 75
    target_rationale: >
      4090 结温上限 88 °C 的 85%，留 13 °C 余量以避免热降频（约 83 °C 起降频）。
      本任务实测最高 70~72 °C，未触发降频。
    definition: 长时负载最高温。
  - key: ppl
    name: 困惑度
    unit: "-"
    direction: lower
    target: null
    definition: WikiText-2，ctx=512，40 chunks；本配置与上一轮同 KV 精度，5.8229。

# ---- 验收标准 -------------------------------------------------------------
acceptance:
  must_pass:
    - decode_tps >= 85
    - vis_decode_tps >= 100
    - peak_vram_mib <= 20480
    - safety_margin_gib >= 4.0
    - quality_pass_rate >= 0.95
    - kv_retrieval_pass >= 0.95
  should_pass:
    - decode_tps_32k >= 75
    - decode_tps_system >= 60
    - vis_ttft_ms <= 870
    - vis_decode_tps_2048 >= 95
    - hard_quality_pass_rate >= 1.0
    - image_tokens_per_image <= 768
    - vision_encode_ms <= 400
    - step_ms <= 34
    - itl_ms_p95 <= 35
  guardrail:
    - ppl_delta_pct <= 2.0
    - no_oom: true
    - no_cpu_fallback: true
    - soak_15min_stable: true
    - vision_quality_no_regression: true
  rollback_trigger: >
    任一 guardrail 违反，或 must_pass 中有 ≥1 项未达标且无更优方案，
    则回滚到 B9_final（上一轮报告 §4.2 的启动命令）。

# ---- 落地复盘 -------------------------------------------------------------
retrospective:
  tradeoffs:
    - point: 草稿深度（本轮主攻方向）
      chose: --spec-draft-n-max 4
      rejected: 2 / 3 / 5 / 6 / 8
      why: >
        步耗时随 n-max 近似线性增长（每多一个草稿 +3.4 ms），
        而 mean_len 在 n-max=4 后饱和（2.31 → 2.70 → 3.06 → 3.07 → 3.24 → 3.33）。
        Decode 速率 = mean_len ÷ 步耗时，因此最优解在「mean_len 增速 = 步耗时增速」处：
        n-max=4 时 3.06 ÷ 32.42 ms = 94.4 t/s，n-max=5 时 3.07 ÷ 36.31 = 84.6，
        n-max=8 时 3.33 ÷ 47.72 = 69.8 —— 与实测完全吻合。
        视觉场景同样偏 n-max=4：vis_1024 在 n-max=4 时 122.6 t/s，
        n-max=2 只有 100.6。
    - point: 并发策略
      chose: --parallel 1
      rejected: --parallel 2（上一轮的配置）
      why: >
        两个**硬**理由 + 一个「不是理由」：
        ① 单请求上下文从 32K 回到 64K（能力提升，不是性能）；
        ② 峰值显存从 20,535 降到 19,851（p2+nmax4 越线，必须放弃）。
        **28K Decode 不是理由**：高重复数对照（各 12 次）显示 p1 78.12 vs p2 77.12，
        基本持平；早期单次对照的 82.89 vs 58.04 是组内方差（48~91 t/s）造成的假象。
        代价是并发吞吐：受控 A/B 下 p2 42.97 → p1 38.39（-10.7%）；
        跨配置口径（含 cap/n-max 变化）则是 67.29 → 53.25。
    - point: 图像 token 上限
      chose: --image-max-tokens 768
      rejected: 1024（上一轮）、1280
      why: >
        最初只是为了省 TTFT（-111 ms）。实测发现它同时修好了上一轮
        归因为「模型能力边界」的失败项：cap 768 时「图 + 20K 文本」
        3/3 正确，cap 1024/1280 时 3/3 失败。机制是图像 token 过多时
        注意力被图片吸走。这是本轮最有价值的意外发现。
    - point: batch / ubatch
      chose: -b 2048 -ub 512
      rejected: 1024（上一轮）、2048/1024、4096/*
      why: >
        b=2048 时 28K Decode 中位 71.94~82.89，b=1024 时 60.28~64.48；
        而 ub 提到 1024 会让峰值显存 +300 MiB 且收益不稳定。
        ub=512 是「不越线」前提下的最优。
  risks:
    - risk: 双路并发吞吐下降 21%
      trigger: 两路同时有请求
      impact: 受控 A/B 下系统吞吐 42.97 → 38.39 t/s（-10.7%）
      mitigation: 若业务以并发为主，改用 B9_final（p2 + n-max 2）；
        或部署两个 p1 实例（但单卡显存不够）
    - risk: 28K 上下文 Decode 未改善
      trigger: ctx > 24K
      impact: 64.97 t/s（基线 69.97）
      mitigation: 长上下文场景单独用 n-max=3；或接受该退化（-7%）
    - risk: cap 768 对细小文字的影响
      trigger: 文档 OCR、小字号
      impact: 864px 缩放后小字可能模糊
      mitigation: 本次 1600px 密集表 3/3 通过；若业务以扫描件为主，
        可对 OCR 请求单独路由到 cap 1024 实例
    - risk: 草稿接受率随任务类型波动
      trigger: 自由创作 / 高温度
      impact: mean_len 从 3.0 掉到 2.0 以下，n-max=4 反而更慢
      mitigation: 按任务类型动态调 n-max；或保持 n-max=2 的保守档
  lessons:
    - "**「输出速率」在投机解码下有两个因子**：速率 = mean_len ÷ 步耗时。只看 t/s 会得出「n-max 越大越快」的错误结论；只有同时量 mean_len 与步耗时，才能定位拐点。本轮 n-max=4 就是这条曲线的顶点。"
    - "**每多一个草稿 token 约 +3.4 ms 步耗时**：这是 4090 上 Q4_K_M 的实测常数，可用于估算任何 n-max 的收益上限。步耗时增长来自验证 batch 变宽，与草稿接受率无关。"
    - "**把「模型能力边界」当结论之前，先改一个无关参数试试**：上一轮「图+长文本」7 项里唯一失败项被归因为模型能力，本轮只是把 cap 从 1024 降到 768 就修好了（3/3）。归因到「模型不行」是最省事也最容易出错的结论。"
    - "**并发不是免费的能力**：受控 A/B 下 p2 的短对话快 9.4%、并发快 10.7%，但把单请求上下文砍半、显存余量从 4.60 削到 3.94 GiB。在单卡上「支持并发」与「单请求体验」是零和的，而 4 GiB 冗余是硬约束 —— 所以只能选 p1。"
    - "**单次对照会骗人，重复数不够时不要下归因**：早期用各 1 次对照得出「p1 的 28K Decode 比 p2 快 43%」，加到各 12 次后只有 78.12 vs 77.12（+1.3%）—— 差异全在组内方差（48~91 t/s）里。凡是方差大于效应量的指标，必须先把重复数加到能分辨为止。"
    - "**评分器 bug 会伪装成模型退化**：本轮修复了答案归一化（`绿色+正方形` vs `绿色正方`），此前把 2 项正确答案误判为失败。质量结论必须能复现到原始答案文本。"
  next_steps:
    - direction: 视觉塔量化到 Q4 并对 OCR 专项评测
      gain: 再省 100 MiB，可支持 p2 + n-max 4
      priority: P1
      precondition: 更大的文档基准
    - direction: 按上下文长度动态切 n-max（短 n4 / 长 n3）
      gain: 28K 场景回到 70+ t/s
      priority: P1
      precondition: 服务端支持按请求设置
    - direction: 多图批编码并行
      gain: 多图请求 TTFT 下降
      priority: P2
      precondition: 多图测试集
