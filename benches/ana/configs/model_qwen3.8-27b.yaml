# ============================================================================
# 模型画像（Model Profile）· 对应业务地图 L1「端侧模型资产与格式」
# ----------------------------------------------------------------------------
# 数据可信度约定（全文通用）：
#   [M] measured   实测/实测换算，可直接引用
#   [D] derived    由实测值推导（如按体积反算参数量）
#   [I] inferred   按公开架构惯例反推，**必须**用 `perfkit define --from-gguf` 覆盖
#   [T] todo       待采集，报告中不得作为结论依据
#
# 本文件已用 GGUF 元数据核验（perfkit define --from-gguf 等价流程），
# 全部架构字段为 [M] 真值。核验过程见 docs/usage.md §6 与报告 §1.2。
# ============================================================================

model:
  name: Qwen3.8-27B
  version: "3.8"
  family: Qwen
  params_total: 27320697856        # [M] GGUF 张量表逐张量累加（含 MTP 预测块）
  params_effective: 26895998464    # [M] 去掉 blk.64（MTP 头）后的前向参数量
  params_active: 26895998464       # 非 MoE：激活参数 = 有效参数
  weight_format: GGUF
  quantization: Q4_K_M
  file: /root/autodl-tmp/models/Qwen3.8-27B-UD-Q4_K_M.gguf   # [M] 16,464,440,224 B
  capabilities: [text, thinking, vision]   # [M] 挂载 mmproj 后具备视觉能力

# ---- 结构超参（[M] 全部来自 GGUF 元数据，不再是反推值）---------------------
# 关键事实：这是**混合架构**（qwen35）——
#   64 层中每 4 层有 1 层是全注意力（full_attention_interval=4），
#   其余 48 层是 SSM / 线性注意力（ssm.* 张量）。
#   因此只有 16 层拥有随 ctx 线性增长的 KV Cache；SSM 层是固定大小的循环状态。
#   旧版画像按「64 层全注意力、8 KV 头、head_dim 128」推算，导致 KV 被高估 4×，
#   这正是历史报告里「模型 6.50 GiB vs 实测 2.20 GiB（2.95×）」差额的根因。
architecture:
  arch: qwen35                     # [M] general.architecture
  hybrid: true                     # [M] SSM + 全注意力交替
  n_layer: 64                      # [M] block_count=65，其中 blk.64 为 MTP 预测块
  n_attn_layer: 16                 # [M] full_attention_interval=4 ⇒ 64/4
  n_ssm_layer: 48                  # [M] 64 - 16
  hidden_size: 5120                # [M]
  intermediate_size: 17408         # [M]
  n_head: 24                       # [M]
  n_head_kv: 4                     # [M] GQA 分组比 6:1
  head_dim: 256                    # [M] attention.key_length / value_length
  attn_out_dim: 6144               # [M] 24×256：注意力输出维度 ≠ hidden(5120)，
                                   #     由 attn_output 投影回 hidden（张量形状 [6144, 5120] 印证）
  rope_theta: 10000000.0           # [M]
  rope_dim: 64                     # [M] rope.dimension_count
  activation: swiglu
  norm: rmsnorm
  norm_eps: 1.0e-6                 # [M]
  tie_embeddings: false            # [M] 存在 output.weight
  sliding_window: null             # [M] 全注意力层无 SWA
  max_ctx_native: 262144           # [M] context_length
  max_ctx_deployed: 65536          # [M] 本次部署实际配置
  vocab_size: 248320               # [M] tokenizer.ggml.tokens 数组长度
  # 混合架构的 SSM 状态参数（决定**不随 ctx 增长**的那部分显存）
  ssm_inner_size: 6144             # [M] ssm.inner_size
  ssm_state_size: 128              # [M] ssm.state_size
  ssm_conv_kernel: 4               # [M] ssm.conv_kernel
  ssm_group_count: 16              # [M] ssm.group_count
  ssm_time_step_rank: 48           # [M] ssm.time_step_rank
  # 嵌入层实测字节（输入 Q4_K + 输出 Q6_K，单一 bits 值算不准）
  embedding_bytes_measured: 1758105600   # [M] 1.637 GiB

# ---- 量化资产清单 ---------------------------------------------------------
artifacts:
  - role: main
    file: Qwen3.8-27B-UD-Q4_K_M.gguf
    bytes: 16464440224             # [M] 15.3235 GiB（含 blk.64 MTP 块）
    note: unsloth 动态量化（imatrix 驱动；FFN 混用 IQ4_XS/Q4_K/Q3_K，注意力头升精度到 Q5_K/Q6_K）
  - role: draft_mtp
    file: mtp-Qwen3.8-27B-Q4_0.gguf
    bytes: 1369590656              # [M] 1.28 GiB，含 blk.64.nextn.* 预测头
    note: 非独立模型，必须经 -md 挂载
  - role: mmproj
    file: mmproj-F16.gguf
    bytes: 927607488               # [M] 885 MiB，ViT→文本空间投影

# ---- 实测权重分解（GGUF 张量表逐张量 × 量化块大小累加）--------------------
# 为什么需要这张表：几何公式只认得「同构的 7 个稠密算子」。混合架构里
# SSM 层的算子（in-proj / z-gate / out-proj）与全注意力层完全不同，
# 层内构成与层间分布都变了，只有按真实张量字节归类才准确。
# 口径：total_gib 是**实际参与前向**的权重（llama.cpp 启动时忽略 blk.64）；
#       token_embd / output_head 单列在 embedding_bytes_measured 中，不重复计入 ops。
weight_breakdown:
  source: "GGUF 张量表 866 个张量 × 量化块大小精确累加；blk.64 按 llama-server 启动日志剔除"
  total_gib: 14.997                # [M] 15.3235 - 0.3269（blk.64 未启用）
  file_gib: 15.324                 # [M] 文件总大小
  ops:
    - op: ffn_down
      kind: dense
      gib: 3.132
      n_layer: 64
      params_m: 5793.4
      note: "FFN 三个矩阵在 64 层全都有，占全部权重的 61.2%"
    - op: ffn_up
      kind: dense
      gib: 3.076
      n_layer: 64
      params_m: 5793.4
    - op: ffn_gate
      kind: dense
      gib: 2.977
      n_layer: 64
      params_m: 5793.4
    - op: attn_qkv
      kind: ssm
      gib: 1.382
      n_layer: 48
      params_m: 2516.6
      note: "SSM 层的融合输入投影（x/B/C 与 z 的共享输入路径）"
    - op: ssm_out
      kind: ssm
      gib: 0.945
      n_layer: 48
      params_m: 1509.9
    - op: attn_gate
      kind: ssm
      gib: 0.824
      n_layer: 48
      params_m: 1509.9
    - op: attn_q
      kind: attn
      gib: 0.527
      n_layer: 16
