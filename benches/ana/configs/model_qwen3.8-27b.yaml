# ---- GGUF 核验记录 ---------------------------------------------------------
# 在目标机上对模型文件做的元数据核验（等价于 `perfkit define --from-gguf`）。
# 记录在这里而不是每次重跑：GGUF 文件在云端 16GB，核验只需读前 64MB，
# 但把结果固化下来可以让配置在本地 replay 时也能显示「已核验」。
# 换模型/换量化档位时必须重新核验并更新本段。
gguf_verification:
  collected: "2026-10-18"
  path: /root/autodl-tmp/models/Qwen3.8-27B-UD-Q4_K_M.gguf
  file_bytes: 16464440224
  version: 3
  tensor_count: 866
  layers_by_tensor: 65
  arch: qwen35
  type_histogram: {F32: 360, Q4_K: 104, Q5_K: 131, IQ4_XS: 117, Q8_0: 106,
                   Q6_K: 30, Q3_K: 7, IQ4_NL: 7, IQ3_S: 4}
  extracted:
    n_layer: 64
    hidden_size: 5120
    intermediate_size: 17408
    n_head: 24
    n_head_kv: 4
    head_dim: 256
    vocab_size: 248320
    rope_theta: 10000000.0
    norm_eps: 1.0e-6
    max_ctx_native: 262144
    sliding_window: null
    tie_embeddings: false
  all_match: true
  kv_gap_explained: >
    真值 n_attn_layer=16 / n_head_kv=4 / head_dim=256 相比旧反推值
    （n_layer=64 / n_head_kv=8 / head_dim=128）把每 token 的 KV 元素数
    从 131,072 降到 32,768（1/4），一次性解释了历史报告里
    「几何 6.50 GiB vs 实测 2.20 GiB（2.95×）」的差额。

# ---- 校准锚点 --------------------------------------------------------------
# 已删除。历史锚点记录的是「几何公式 6.50 GiB vs 台账 2.20 GiB，差 2.95×」，
# 根因已查明并用 GGUF 真值消除：
#   旧假设：64 层全注意力 × 8 KV 头 × head_dim 128 → 每 token 131,072 元素
#   真  值：16 层全注意力 × 4 KV 头 × head_dim 256 → 每 token  32,768 元素（正好 1/4）
# 用真值重算 64K + q8_0/q4_0 的 KV = 1.63 GiB，与实测 ~2.2 GiB 同量级，
# 差额来自台账的工程粗估（原文即写「~2.2 GB」）与运行时缓冲。
