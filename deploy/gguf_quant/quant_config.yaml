model_input_path: "/model/ModelScope/Qwen/Qwen3.8-27B"
output_dir: "/root/Qwen3.8-27B-quant"
model_name: "Qwen3.8-27B"
llama_cpp_bin_dir: "/root/llama.cpp/build/bin"
llama_cpp_src_dir: "/root/llama.cpp"

target_quants:
  - "Q4_K_M"
  - "Q5_K_M"
  - "Q8_0"

imatrix_mode: "self_gen"
imatrix_chunks: 100
